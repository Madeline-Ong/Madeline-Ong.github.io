<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Admin Page" />
    <meta name="author" content="Your Name" />
    <title>Account Management</title>
    <link href="../static/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="../static/css/styles.css" rel="stylesheet">
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
</head>
<body class="sb-nav-fixed">
    <nav class="sb-topnav navbar navbar-expand navbar-dark bg-dark">
        <a class="navbar-brand ps-3" href="#">Dashboard</a>
        <button class="btn btn-link btn-sm order-1 order-lg-0 me-4 me-lg-0" id="sidebarToggle" href="#"><i class="fas fa-bars"></i></button>
    </nav>

    <div id="layoutSidenav">
        <div id="layoutSidenav_nav">
            <nav class="sb-sidenav accordion sb-sidenav-dark" id="sidenavAccordion">
                {% include '/sidebar.html' %}
            </nav>
        </div>

        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid px-4">
                    <h1 class="mt-4">Welcome, {{ name }}</h1>
                    <ol class="breadcrumb mb-4">
                        <li class="breadcrumb-item active">Change Password</li>
                    </ol>
                    
                    <!-- Change Password Section -->
                    <div class="d-flex justify-content-center align-items-center flex-column">
                        <form id="change-password-form" class="w-50">
                            <div class="mb-3">
                                <label for="oldPassword" class="form-label">Old Password</label>
                                <input type="password" class="form-control w-100" id="oldPassword" name="oldPassword" required>
                            </div>
                            <div class="mb-3">
                                <label for="newPassword" class="form-label">New Password</label>
                                <input type="password" class="form-control w-100" id="newPassword" name="newPassword" required>
                            </div>
                            <div class="mb-3">
                                <label for="confirmNewPassword" class="form-label">Confirm New Password</label>
                                <input type="password" class="form-control w-100" id="confirmNewPassword" name="confirmNewPassword" required>
                            </div>
                            <div id="password-error" class="text-danger" style="display: none;">Passwords do not match.</div>
                            <button type="submit" class="btn btn-primary w-100">Update Password</button>
                            <div id="error-message" class="alert alert-danger" style="display:none;"></div>
                            <div id="success-message" class="alert alert-success" style="display:none;"></div>

                            <!-- Display error message -->
                                {% if error_message %}
                                <div class="alert alert-danger">{{ error_message }}</div>
                                {% endif %}

                                <!-- Display success message -->
                                {% if success_message %}
                                <div class="alert alert-success">{{ success_message }}</div>
                                {% endif %}

                        </form>
                    </div>


                    

                </div>
            </main>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="../static/cdn/bootstrap.min.js"></script>

    <script>
$(document).ready(function() {
    $("#change-password-form").submit(function(event) {
        event.preventDefault();

        let oldPassword = $("#oldPassword").val();
        let newPassword = $("#newPassword").val();
        let confirmNewPassword = $("#confirmNewPassword").val();

        if (newPassword !== confirmNewPassword) {
            $("#password-error").show();
            return;
        } else {
            $("#password-error").hide();
        }

        $.ajax({
            url: "/change_password",
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify({
                oldPassword: oldPassword,
                newPassword: newPassword
            }),
            success: function(response) {
                if (response.success) {
                    $("#success-message").text(response.message).show();
                    $("#error-message").hide();
                    $("#change-password-form")[0].reset();
                } else {
                    $("#error-message").text(response.error).show();
                    $("#success-message").hide();
                }
            },
            error: function(xhr) {
                // Handle any error that occurs during the AJAX request
                console.error('Request failed:', xhr.responseText);  // Log error for debugging
                $("#error-message").text("An error occurred, please try again.").show();
                $("#success-message").hide();
            }
        });
    });
});

    </script>
</body>
</html>
