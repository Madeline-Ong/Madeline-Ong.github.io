<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="AdminLogs - Attack Surface Management" />
    <meta name="author" content="Your Name" />
    <title>AdminLogs - Attack Surface Management</title>
    <link href="./static/css/bootstrap.min.css" rel="stylesheet">
    <link href="./static/css/style1.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet">
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
</head>
<body class="sb-nav-fixed">
    <nav class="sb-topnav navbar navbar-expand navbar-dark bg-dark">
        <a class="navbar-brand ps-3" href="{{ url_for('main_page') }}">Dashboard</a>
        <button class="btn btn-link btn-sm order-1 order-lg-0 me-4 me-lg-0" id="sidebarToggle" href="#"><i class="fas fa-bars"></i></button>
    </nav>

    <div id="layoutSidenav">
        <div id="layoutSidenav_nav">
            <nav class="sb-sidenav accordion sb-sidenav-dark" id="sidenavAccordion">
                    {% include '/sidebar.html' %}
            </nav>
        </div>

        <div id="layoutSidenav_content">
            <main>
                <div class="container">
                    <h2 class="my-4">Admin Logs</h2>
                    <!-- Table Section -->
                    <table class="table table-striped table-bordered" id="adminlogsTable">
                        <thead>
                            <tr>
                                <th>Time</th>
                                <th>User</th>
                                <th>Role</th>
                                <th>Company</th>
                                <th>Action Type</th>
                                <th>Description</th>
                                
                            </tr>
                        </thead>
                        <tbody>
                            {% for log in logs %}
                            <tr>
                                <td>{{ log['Time'] }}</td>
                                <td>{{ log['UserName'] }}</td>
                                <td>{{ log['UserRole'] }}</td>
                                <td>{{ log['Company'] }}</td>
                                <td>{{ log['ActionType'] }}</td>
                                <td>{{ log['Description'] }}</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                        
                    </table>
                </div>
            </main>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="./static/css/bootstrap.min.css" crossorigin="anonymous"></script>
    <script>
        $(document).ready(function () {
            // Initialize DataTable
            const table = $('#adminlogsTable').DataTable({
                "paging": true,
                "searching": true,
                "ordering": true,
                "order": [[0, 'desc']]
            });
        });
    </script>
</body>
</html>
