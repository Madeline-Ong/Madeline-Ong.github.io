events {
    ## set max number of worker connections
    worker_connections 1024;
}

http {
    ## sending over static files
    sendfile on;

    upstream portal {
        ## server (docker) name and port running on
        server web-portal:3000;  
    }

    ## http server
    server {
        listen 3000;
        server_name localhost;

        ## anything on port 3000 is redirected
        location / {
            return 301 https://$host$request_uri;
        }
    }

    ## https server
    server {
        listen 443 ssl;
        server_name localhost;

        ## providing the cert and key 
        ssl_certificate /etc/ssl/certs/my-site.crt;
        ssl_certificate_key /etc/ssl/private/my-site.key;

        location / {
            ## forward any requests from the web-portal to the https server
            proxy_pass http://web-portal:3000;
            ## sets host header to be same as client's request
            proxy_set_header Host $host;
            ## passes client's ip address to the server
            proxy_set_header X-Real-IP $remote_addr;
            ## tracks original IP address of client
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            ## lets server know if request was og http/https
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 216000;
            proxy_send_timeout 216000;
            proxy_read_timeout 216000;
            send_timeout 216000;

        }
    }
}
